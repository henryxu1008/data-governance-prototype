name: Prototype CI
on:
  push:
    branches: [main, feat/extract-governance-demo]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static contracts
        run: npm test
      - name: Production build
        run: GITHUB_PAGES=true npm run build
      - name: Check built assets
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q 'data-governance-prototype/assets/' dist/index.html
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-prototype
          path: dist/
          retention-days: 7
