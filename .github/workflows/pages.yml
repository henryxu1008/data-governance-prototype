name: Deploy Prototype to GitHub Pages
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch to verify (publish requires main)'
        type: string
        required: true
        default: 'feat/extract-governance-demo'
      publish:
        description: 'Publish validated main only'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx --no-install playwright install --with-deps chromium
      - run: GITHUB_PAGES=true npm run build
      - run: node scripts/browser-smoke.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    if: inputs.publish == true && inputs.target_ref == 'main' && github.ref == 'refs/heads/main'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
